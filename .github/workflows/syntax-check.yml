name: Syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without downloading LFS objects
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Parse R scripts
        run: >-
          Rscript -e 'fs <- list.files("code", pattern="[.]R$", recursive=TRUE,
          full.names=TRUE); for (f in fs) parse(file=f);
          cat("Parsed", length(fs), "R scripts\n")'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile Python scripts
        run: python -m compileall -q code
